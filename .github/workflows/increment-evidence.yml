name: Evidencia del incremento

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  traceability:
    name: Verificar ficha y evidencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Revisar cambios del PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/incremento.py verificar "$BASE_SHA" "$HEAD_SHA"
