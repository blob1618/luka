# testing/docker-compose.yml
services:
  streamlit:
    build:
      context: ..
      dockerfile: testing/Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - ..:/app
      - testing_data:/data
    env_file:
      - ../.env
    environment:
      - REDIS_URL=redis://redis:6379
      - TESTING_DATABASE_URL=sqlite:////data/testing_luka.db
      - PYTHONPATH=/app
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    restart: unless-stopped

volumes:
  testing_data:
